      - name: Configure Google Benchmark (x64 ${{ matrix.config }}) #Configure Google Benchmark (CMake)
        shell: pwsh
        #run: 'powershell -NoProfile -Command "cmake -S \"$env:GITHUB_WORKSPACE\\benchmark\" -B \"$env:GITHUB_WORKSPACE\\benchmark\\build\" -A x64 -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL -DBENCHMARK_DOWNLOAD_DEPENDENCIES=ON -DBENCHMARK_ENABLE_TESTING=OFF"'
        #run: cmake -S "$env:GITHUB_WORKSPACE\benchmark" -B "$env:GITHUB_WORKSPACE\benchmark\build" -A x64 -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL -DBENCHMARK_DOWNLOAD_DEPENDENCIES=ON -DBENCHMARK_ENABLE_TESTING=OFF
        run: |
          $wd = $env:GITHUB_WORKSPACE
          $cfg = "${{ matrix.config }}"
          $src = Join-Path $wd "benchmark"
          $build = Join-Path $src "out\\build\\x64-$cfg"

          if (Test-Path $build) { Remove-Item -LiteralPath $build -Recurse -Force }

          $runtime = if ($cfg -eq "Debug") { "MultiThreadedDebugDLL" } else { "MultiThreadedDLL" }

          cmake -G "Visual Studio 17 2022" -A x64 -S "$src" -B "$build" -DCMAKE_BUILD_TYPE="$cfg" -DCMAKE_MSVC_RUNTIME_LIBRARY="$runtime" -DBENCHMARK_DOWNLOAD_DEPENDENCIES=ON -DBENCHMARK_ENABLE_TESTING=OFF -DBENCHMARK_ENABLE_GTEST_TESTS=OFF -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX="C:/benchmark/out/build/x64-$cfg"
          if ($LASTEXITCODE -ne 0) { Write-Error "CMake configure benchmark failed"; exit $LASTEXITCODE }

          $rulesPath = Join-Path $build "CMakeFiles\rules.ninja"
          if (Test-Path $rulesPath) { Write-Host "---- benchmark rules.ninja snippet ----"; Get-Content $rulesPath -TotalCount 40 | Out-Host }
          $cachePath = Join-Path $build "CMakeCache.txt"
          if (Test-Path $cachePath) { Write-Host "---- benchmark CMakeCache entries ----"; Select-String -Path $cachePath -Pattern "CMAKE_BUILD_TYPE|CMAKE_MSVC_RUNTIME_LIBRARY" | Out-Host }

          $rulesPath = Join-Path $build "CMakeFiles\rules.ninja"
          if (Test-Path $rulesPath) { Write-Host "---- benchmark rules.ninja snippet ----"; Get-Content $rulesPath -TotalCount 40 | Out-Host }
          $cachePath = Join-Path $build "CMakeCache.txt"
          if (Test-Path $cachePath) { Write-Host "---- benchmark CMakeCache entries ----"; Select-String -Path $cachePath -Pattern "CMAKE_BUILD_TYPE|CMAKE_MSVC_RUNTIME_LIBRARY" | Out-Host }

      - name: Build Google Benchmark (x64 ${{ matrix.config }}) #Build Google Benchmark
        shell: pwsh
        #run: 'powershell -NoProfile -Command "cmake --build \"$env:GITHUB_WORKSPACE\\benchmark\\build\" --config ${{ matrix.config }}"'
        #run: cmake --build "$env:GITHUB_WORKSPACE\benchmark\build" --config ${{ matrix.config }}
        run: |
          $wd = $env:GITHUB_WORKSPACE
          $cfg = "${{ matrix.config }}"
          $src = Join-Path $wd "benchmark"
          $build = Join-Path $src "out\\build\\x64-$cfg"

          cmake --build "$build" --config "$cfg"
          if ($LASTEXITCODE -ne 0) { Write-Error "Build benchmark failed"; exit $LASTEXITCODE }

          # Install to the prefix so libs are placed in a predictable location
          cmake --install "$build" --config "$cfg"
          if ($LASTEXITCODE -ne 0) { Write-Host "cmake --install failed, falling back to manual copy" }

          $stageInclude = "C:\benchmark\include"
          $stageLibDir  = "C:\benchmark\out\build\x64-$cfg\src"
          if (Test-Path $stageLibDir) { Remove-Item -LiteralPath $stageLibDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stageInclude | Out-Null
          New-Item -ItemType Directory -Force -Path $stageLibDir | Out-Null

          Copy-Item -Recurse -Force "$src\include\*" $stageInclude -ErrorAction SilentlyContinue

          Get-ChildItem -Path $build -Recurse -Filter *.lib -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item -Force $_.FullName $stageLibDir -ErrorAction SilentlyContinue }

          Write-Host "Staged benchmark libs:"
          Get-ChildItem -Path $stageLibDir -Filter *.lib -ErrorAction SilentlyContinue | Out-Host

      - name: Verify staged libs
        shell: pwsh
        run: |
          Write-Host "C:\googletest libs:"; Get-ChildItem -Path "C:\googletest\out\build" -Recurse -Filter *.lib -ErrorAction SilentlyContinue
