      - name: Clone GoogleTest
        shell: pwsh
        #run: 'powershell -NoProfile -Command "git clone https://github.com/google/googletest.git \"$env:GITHUB_WORKSPACE\\googletest\""' 
        #run: git clone https://github.com/google/googletest.git "$env:GITHUB_WORKSPACE\googletest"
        run: |
          $wd = $env:GITHUB_WORKSPACE
          $dst = Join-Path $wd "googletest"
          if (Test-Path $dst) { Remove-Item -LiteralPath $dst -Recurse -Force }
          git clone https://github.com/google/googletest.git $dst
          if ($LASTEXITCODE -ne 0) { Write-Error "git clone googletest failed"; exit $LASTEXITCODE }

      - name: Configure GoogleTest (x64 ${{ matrix.config }}) #Configure GoogleTest (CMake)
        shell: pwsh
        #run: 'powershell -NoProfile -Command "cmake -S \"$env:GITHUB_WORKSPACE\\googletest\" -B \"$env:GITHUB_WORKSPACE\\googletest\\build\" -A x64 -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL"'
        #run: cmake -S "$env:GITHUB_WORKSPACE\googletest" -B "$env:GITHUB_WORKSPACE\googletest\build" -A x64 -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreadedDLL
        run: |
          $wd = $env:GITHUB_WORKSPACE
          $cfg = "${{ matrix.config }}"
          $src = Join-Path $wd "googletest"
          $build = Join-Path $src "out\\build\\x64-$cfg"

          # Clean previous build dir
          if (Test-Path $build) { Remove-Item -LiteralPath $build -Recurse -Force }

          $runtime = if ($cfg -eq "Debug") { "MultiThreadedDebugDLL" } else { "MultiThreadedDLL" }

          # Force MSVC generator so we produce .lib compatible with MSBuild
          cmake -G "Visual Studio 17 2022" -A x64 -S "$src" -B "$build" -DCMAKE_BUILD_TYPE="$cfg" -DCMAKE_MSVC_RUNTIME_LIBRARY="$runtime" -DBUILD_GMOCK=ON -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX="C:/googletest/out/build/x64-$cfg"
          if ($LASTEXITCODE -ne 0) { Write-Error "CMake configure googletest failed"; exit $LASTEXITCODE }

          # Diagnostic: print small snippets safely
          $rulesPath = Join-Path $build "CMakeFiles\rules.ninja"
          if (Test-Path $rulesPath) { Write-Host "---- rules.ninja snippet ----"; Get-Content $rulesPath -TotalCount 40 | Out-Host }
          $cachePath = Join-Path $build "CMakeCache.txt"
          if (Test-Path $cachePath) { Write-Host "---- CMakeCache entries ----"; Select-String -Path $cachePath -Pattern "CMAKE_BUILD_TYPE|CMAKE_MSVC_RUNTIME_LIBRARY" | Out-Host }

        
      - name: Build GoogleTest (x64 ${{ matrix.config }}) #Build GoogleTest
        shell: pwsh
        #run: 'powershell -NoProfile -Command "cmake --build \"$env:GITHUB_WORKSPACE\\googletest\\build\" --config ${{ matrix.config }}"'
        #run: cmake --build "$env:GITHUB_WORKSPACE\googletest\build" --config ${{ matrix.config }}
        run: |
          $wd = $env:GITHUB_WORKSPACE
          $cfg = "${{ matrix.config }}"
          $src = Join-Path $wd "googletest"
          $build = Join-Path $src "out\\build\\x64-$cfg"

          cmake --build "$build" --config "$cfg"
          if ($LASTEXITCODE -ne 0) { Write-Error "Build googletest failed"; exit $LASTEXITCODE }

          # Install (preferred) so CMake places libs/headers in install prefix
          cmake --install "$build" --config "$cfg"
          if ($LASTEXITCODE -ne 0) { Write-Host "cmake --install failed, falling back to manual copy" }

          # Fallback: copy any .lib produced into the staging folder expected by the solution
          $stageLibDir  = "C:\googletest\out\build\x64-$cfg\lib"
          $stageInclude1 = "C:\googletest\googletest\include"
          $stageInclude2 = "C:\googletest\googlemock\include"
          if (Test-Path $stageLibDir) { Remove-Item -LiteralPath $stageLibDir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $stageLibDir | Out-Null
          New-Item -ItemType Directory -Force -Path $stageInclude1 | Out-Null
          New-Item -ItemType Directory -Force -Path $stageInclude2 | Out-Null

          Copy-Item -Recurse -Force "$src\googletest\include\*" $stageInclude1 -ErrorAction SilentlyContinue
          Copy-Item -Recurse -Force "$src\googlemock\include\*" $stageInclude2 -ErrorAction SilentlyContinue

          Get-ChildItem -Path $build -Recurse -Filter *.lib -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item -Force $_.FullName $stageLibDir -ErrorAction SilentlyContinue }

          Write-Host "Staged googletest libs:"
          Get-ChildItem -Path $stageLibDir -Filter *.lib -ErrorAction SilentlyContinue | Out-Host
        
      - name: Clone Google Benchmark
