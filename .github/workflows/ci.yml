      - name: Build solution (x64 ${{ matrix.config }})
        shell: pwsh
        run: |
          cd $env:GITHUB_WORKSPACE
          $slnx = Join-Path $env:GITHUB_WORKSPACE "AdderSuite.slnx"
          $sln  = Join-Path $env:GITHUB_WORKSPACE "AdderSuite.sln"
          if (Test-Path $slnx) { $sln = $slnx }
          elseif (Test-Path $sln) { $sln = $sln }
          else { Write-Error "Solution file not found."; exit 1 }

          Write-Host "Building solution: $sln"
          Get-Command msbuild | Select-Object Path,Version | Write-Host

          $log = Join-Path $env:GITHUB_WORKSPACE "msbuild_${{ matrix.config }}.log"

          & msbuild $sln /p:Configuration="${{ matrix.config }}" /p:Platform=x64 /p:PlatformToolset=v143 /m /fl /flp:"logfile=$log;verbosity=normal"
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Host "MSBuild failed with exit code $code. Log: $log"
            exit $code
          }

      - name: Upload msbuild log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: msbuild-log-${{ matrix.config }}
          path: msbuild_${{ matrix.config }}.log

