        #run: 'powershell -NoProfile -Command "Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter *.vcxproj | ForEach-Object { (Get-Content $_.FullName) -replace ''<PlatformToolset>v145</PlatformToolset>'',''<PlatformToolset>v143</PlatformToolset>'' | Set-Content $_.FullName -Encoding UTF8 } ; Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter *.sln | ForEach-Object { (Get-Content $_.FullName) -replace ''PlatformToolset=v145'',''PlatformToolset=v143'' | Set-Content $_.FullName -Encoding UTF8 }"'          
        #run: 'powershell -NoProfile -Command "Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter *.vcxproj | ForEach-Object { $p = $_.FullName; (Get-Content -Raw $p) -replace ''<PlatformToolset>v145</PlatformToolset>'',''<PlatformToolset>v143</PlatformToolset>'' | Set-Content -LiteralPath $p -Encoding UTF8 } ; Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter *.sln | ForEach-Object { $p = $_.FullName; (Get-Content -Raw $p) -replace ''PlatformToolset=v145'',''PlatformToolset=v143'' | Set-Content -LiteralPath $p -Encoding UTF8 }"'
        #run: 'powershell -NoProfile -Command "Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter *.vcxproj | ForEach-Object { $p = $_.FullName; (Get-Content -Raw -LiteralPath $p) -replace ''<PlatformToolset>v145</PlatformToolset>'',''<PlatformToolset>v143</PlatformToolset>'' | Set-Content -LiteralPath $p -Encoding UTF8 } ; Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter *.sln | ForEach-Object { $p = $_.FullName; (Get-Content -Raw -LiteralPath $p) -replace ''PlatformToolset=v145'',''PlatformToolset=v143'' | Set-Content -LiteralPath $p -Encoding UTF8 }"'
        run: |
          Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter *.vcxproj | ForEach-Object {
            $p = $_.FullName
            (Get-Content -Raw -LiteralPath $p) -replace '<PlatformToolset>v145</PlatformToolset>','<PlatformToolset>v143</PlatformToolset>' |
              Set-Content -LiteralPath $p -Encoding UTF8
          }

          Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter *.sln | ForEach-Object {
            $p = $_.FullName
            (Get-Content -Raw -LiteralPath $p) -replace 'PlatformToolset=v145','PlatformToolset=v143' |
              Set-Content -LiteralPath $p -Encoding UTF8
          }

